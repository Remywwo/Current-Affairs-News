name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署；不取消进行中的部署，避免半完成的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建并发布
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传静态文件
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          # 站点是纯静态：index.html + assets/ + data/
          path: |
            index.html
            assets/
            data/

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
