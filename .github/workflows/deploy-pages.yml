name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # 只关心前端产物与数据的变化。
      # scripts/ 的改动若不影响产物（如仅更新抓取逻辑），由「更新数据」流水线负责。
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    # 手动触发，用于强制重新部署（不改任何代码）
  workflow_run:
    # 「更新数据」流水线跑完后重新部署。
    #
    # 为什么必须有这个：更新流水线用 GITHUB_TOKEN 推送提交，
    # 而 GitHub 规定 **GITHUB_TOKEN 的推送不会触发其他 workflow**（防递归机制）。
    # 所以数据更新后，push 事件收不到任何触发 —— 只能靠 workflow_run。
    #
    # workflow_run 不受该限制，且只在被监控的 workflow 完成后触发，
    # 因此每天自动更新的数据能真正部署上线。
    workflows: ['更新数据']
    branches: [main]
    types: [completed]

# 注意：push 与 workflow_run 可能同时命中同一次提交，导致部署两遍。
# 用下面的 concurrency 串行化 —— 第二次运行会等第一个跑完，
# 部署两次结果相同，无副作用，只是多花几十秒。
#
# 同一分支的部署串行执行，避免两个部署同时推送互相覆盖
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 数据更新流水线失败时不要部署 —— 那意味着数据可能处于半更新状态，
    # 部署出去的是坏数据。push 与手动触发不受此限制。
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 显式指定分支：workflow_run 触发时默认也是 main，
          # 但写明更稳妥 —— 要部署的一定是含最新数据的 main。
          ref: main

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 启动预览服务
        # 浏览器测试需要一个 HTTP 服务。背景任务 + 轮询等待就绪，
        # 不用 --strictPort（端口被占用时自动换端口反而更难排查）。
        run: |
          set -euo pipefail
          npx vite preview --port 4173 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:4173/; then
              echo "预览服务已就绪"
              break
            fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:4173/ || {
            echo "预览服务启动失败"; exit 1;
          }

      - name: 浏览器端到端测试
        # 用真实 Chromium 跑：渲染、限长、瀑布流几何、中文输入、主题切换
        run: node scripts/browser-test.mjs http://127.0.0.1:4173/

      - name: 响应式测试
        # 校验各断点下的列数、限宽居中、以及窗口缩放后的重排
        run: node scripts/responsive-test.mjs http://127.0.0.1:4173/

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
