name: 更新数据

on:
  schedule:
    # 每天两次抓取：北京时间 09:15 与 13:15（UTC 01:15 / 05:15）。
    #
    # 为什么挂两条 cron：
    #   GitHub 官方文档明确说明 —— schedule 事件在高负载时会延迟，
    #   而「每个整点的 0 分」正是负载最高处，排队中的任务甚至会被
    #   **直接丢弃**，且不会补跑。单条 cron 一旦被丢，当天就彻底没有更新。
    #
    #   本仓库已经踩过一次：2026-11-23 01:00 UTC 那次定时触发从未出现在
    #   运行记录里（`gh run list` 显示 8 次运行全部是 workflow_dispatch，
    #   schedule 触发 0 次）。上午被丢时还有下午这次兜底。
    #
    #   流水线本身是幂等的 —— 只按 sourceUrl 追加新条目，
    #   check-changes.py 会拦住无实质变化的提交 —— 所以多跑一次
    #   不会产生重复数据，也不会产生重复提交。
    #
    # 为什么都不在整点 0 分：
    #   GitHub 官方建议「schedule at a less busy time, not on the hour」。
    #   原先的 '0 1 * * *' 恰好踩在负载最高的整点 0 分。
    #
    # 另外两条硬性前提（任一不满足，定时任务会完全不生效且无报错）：
    #   1. schedule 只在**默认分支**上生效（本仓库默认分支为 main）；
    #   2. 公开仓库连续 60 天无提交，GitHub 会自动停用定时工作流。
    - cron: '15 1 * * *'
    - cron: '15 5 * * *'
  workflow_dispatch:
    # 手动触发，支持传参
    inputs:
      dry_run:
        description: '试运行（只抓取校验，不写入数据）'
        type: boolean
        default: false
      force_commit:
        description: '即使数据无实质变化也提交（用于刷新页面时间戳）'
        type: boolean
        default: false

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: 抓取并更新数据
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行更新流水线
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || false }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "▶ 试运行模式：不写入数据"
            python3 scripts/update.py --dry-run
          else
            echo "▶ 正式更新模式"
            python3 scripts/update.py
          fi

      - name: 校验数据确实写入了当天
        # 定时任务最隐蔽的失败不是「报错」，而是「跑了但什么也没写」：
        # job 是绿的，页面上的「数据快照」却停在几天前，没人会收到通知。
        #
        # update.py 在非试运行模式下无论有没有新增条目都会刷新 updatedAt，
        # 所以日期对不上就说明写入路径没走到 —— 直接让 job 变红，
        # GitHub 会对失败的定时运行发邮件，静默失败因此变得可见。
        #
        # 试运行时本就不会写盘，跳过断言。
        if: github.event.inputs.dry_run != 'true'
        run: python3 scripts/check-freshness.py

      - name: 安装依赖
        run: npm ci

      - name: 运行前端回归测试
        # 更新完数据必须验证前端还能正常渲染，防止坏数据导致站点白屏
        # 用 npx tsx 而非 node —— 测试要直接 import src/ 下的 .tsx 组件
        run: |
          set -euo pipefail
          npx tsx scripts/render-test.mjs
          node scripts/masonry-test.mjs
          npx tsx scripts/truncate-test.mjs

      - name: 检测数据实质变化
        id: changes
        run: |
          set -euo pipefail
          # 脚本有实质变化返回 0，无变化返回 1
          if python3 scripts/check-changes.py --verbose; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交并推送
        if: steps.changes.outputs.changed == 'true' || github.event.inputs.force_commit == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/
          # --allow-empty：force_commit 时即使内容没变也要留痕，
          # 否则 git commit 因无变更退出码 1，会把整个 job 标红
          git commit --allow-empty -m "chore(data): 自动更新 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git push

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-snapshot
          path: src/data/*.json
          retention-days: 7
          if-no-files-found: ignore
